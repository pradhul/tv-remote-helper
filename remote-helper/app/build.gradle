plugins { id 'com.android.application' }
android {
    namespace 'com.pradhul.remotehelper'
    compileSdk 34
    defaultConfig { applicationId 'com.pradhul.remotehelper'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    lint { abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
